# ============================================================
# 真实数据源配置（Druid 连接池 + MySQL）
# 本文件被 application.yml 通过 spring.profiles.active: druid 引用
# 数据库连接信息（url/账号/密码）写在这里
# ============================================================
spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/campus_pickup?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 你的数据库密码
    druid:
      # 初始连接数
      initial-size: 5
      # 最小空闲连接数
      min-idle: 10
      # 最大活跃连接数
      max-active: 20
      # 获取连接最大等待时间(毫秒)
      max-wait: 60000
      # 连接有效性检测 SQL
      validation-query: SELECT 1
      # 空闲时检测
      test-while-idle: true
      # 借出时检测
      test-on-borrow: false
      # 归还时检测
      test-on-return: false
      # 配置监控统计拦截的 filters
      filters: stat,wall

# ============================================================
# 阿里云 OSS 真实配置
# ============================================================
aliyun:
  oss:
    # 地域节点（注意：不带 https:// 前缀）
    endpoint: oss-cn-beijing.aliyuncs.com
    access-key-id: 你的access-key-id
    access-key-secret: 你的access-key-secret
    bucket-name: 你的bucket-name
    # 访问域名（用于拼接上传后的文件 URL）
    domain: 你的domain
    region: cn-beijing

# ============================================================
# 微信小程序登录配置
# ============================================================
wechat:
  # 小程序 AppID（与 campus-pickup-miniapp/project.config.json 一致）
  appid: 你的appid
  # 小程序 AppSecret（用于 code2session）
  secret: 你的secret
